<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思维导图 · 土妹频道</title>
<link rel="icon" href="头像.png">
<!--
  XMind 在线查看页。用法：网站/xmind.html?file=<仓库里的 .xmind 路径>
  用 XMind 官方的 xmind-embed-viewer 显示（内容在 xmind.app / xmind.cn 的 iframe 里渲染）。
  中国大陆时区默认走 xmind.cn，也可以加 &region=cn 或 &region=global 指定。
-->
<style>
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --text: #2b2622;
  --muted: #7a7068;
  --line: #ebe4da;
  --accent: #c8402f;
  --chip: #f1ebe2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1816;
    --surface: #24211e;
    --text: #ece6de;
    --muted: #a39a90;
    --line: #36312c;
    --accent: #ef6a55;
    --chip: #2e2a26;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
}
header h1 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header a { font-size: 13px; color: var(--text); text-decoration: none; padding: 3px 10px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
header a:hover { color: var(--accent); }
main { flex: 1; position: relative; min-height: 0; }
#viewer { position: absolute; inset: 0; }
#viewer iframe { border: 0; display: block; }
[hidden] { display: none !important; }
#msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<header>
  <a href="../">← 资料库</a>
  <h1 id="title">思维导图</h1>
  <a id="switch" href="#" hidden>加载慢？换线路</a>
  <a id="download" href="#" download hidden>下载 .xmind</a>
</header>
<main>
  <div id="viewer"></div>
  <div id="msg">正在加载思维导图…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xmind-embed-viewer@1.2.0/dist/umd/xmind-embed-viewer.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || '';
  const msg = document.getElementById('msg');
  const fail = (text) => { msg.textContent = text; msg.hidden = false; };

  // 只接受仓库里的相对路径，避免被拿去加载别的网站的文件
  if (!/\.xmind$/i.test(file) || /^[a-z]+:|^\/|(^|\/)\.\.(\/|$)/i.test(file)) {
    fail('没有指定要打开的 .xmind 文件。');
    return;
  }

  const name = file.split('/').pop().replace(/\.xmind$/i, '');
  document.getElementById('title').textContent = name;
  document.title = name + ' · 思维导图 · 土妹频道';

  const url = '../' + file.split('/').map(encodeURIComponent).join('/');
  const dl = document.getElementById('download');
  dl.href = url;
  dl.hidden = false;

  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
  const region = params.get('region') ||
    (/^Asia\/(Shanghai|Chongqing|Harbin|Urumqi)$/.test(tz) ? 'cn' : 'global');
  const sw = document.getElementById('switch');
  const other = new URLSearchParams(params);
  other.set('region', region === 'cn' ? 'global' : 'cn');
  sw.href = '?' + other.toString();
  sw.hidden = false;

  if (!window.XMindEmbedViewer) {
    fail('查看器没加载出来，请检查网络，或点右上角下载后用 XMind 打开。');
    return;
  }

  const viewer = new XMindEmbedViewer({
    el: '#viewer',
    region: region,
    styles: { width: '100%', height: '100%' },
  });
  viewer.addEventListener('map-ready', () => { msg.hidden = true; viewer.setFitMap(); });

  fetch(url)
    .then((res) => { if (!res.ok) throw new Error(res.status); return res.arrayBuffer(); })
    .then((buf) => viewer.load(buf))
    .catch(() => fail('文件读取失败，请点右上角下载后用 XMind 打开。'));
})();
</script>
</body>
</html>
