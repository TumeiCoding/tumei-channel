name: 更新资料目录 index.html

# 每次上传/修改资料后，自动重新生成根目录的 index.html
on:
  push:
    branches: [master]
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来取每个文件的上传日期
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_index.py
      - name: 有变化就提交
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html 没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "自动更新 index.html"
          git push
