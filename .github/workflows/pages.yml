name: 发布网站

# 每次推送后：生成首页 index.html，并把整个资料库发布到 GitHub Pages。
# index.html 只在这里生成，不提交到仓库。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来取每个文件的上传日期
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 网站/生成首页.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
