const listEl = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const qEl = document.getElementById('q');
let activeCat = '全部';

// 分类顺序：新资料在前（按最新日期），旧资料在后
const catInfo = new Map();
for (const it of ITEMS) {
  const c = catInfo.get(it.category) || { old: it.old, latest: '' };
  if ((it.date || '') > c.latest) c.latest = it.date || '';
  catInfo.set(it.category, c);
}
const cats = [...catInfo.keys()].sort((a, b) => {
  const A = catInfo.get(a), B = catInfo.get(b);
  if (A.old !== B.old) return A.old ? 1 : -1;
  return B.latest.localeCompare(A.latest);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderChips() {
  chipsEl.innerHTML = ['全部', ...cats].map(c =>
    `<button type="button" aria-pressed="${c === activeCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}

function card(it) {
  const external = /^https?:/.test(it.href);
  const meta = [
    `<span class="badge ${it.kind === 'HTML' ? 'html' : ''}">${it.kind === 'HTML' ? '在线演示' : esc(it.kind)}</span>`,
    it.date ? `<span>${esc(it.date)}</span>` : '',
    it.episode ? `<span>${esc(it.episode)}</span>` : '',
  ].join('');
  return `<a class="card" href="${esc(encodeURI(decodeURI(it.href)))}" ${external ? 'target="_blank" rel="noopener"' : ''}>
    <div class="t">${esc(it.title)}</div><div class="meta">${meta}</div></a>`;
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const match = it => (activeCat === '全部' || it.category === activeCat) &&
    (!q || (it.title + ' ' + it.path + ' ' + it.episode).toLowerCase().includes(q));
  let html = '';
  for (const c of cats) {
    const rows = ITEMS.filter(it => it.category === c && match(it));
    if (!rows.length) continue;
    // 在线演示排前面，其他格式排后面
    rows.sort((a, b) => (a.kind === 'HTML' ? 0 : 1) - (b.kind === 'HTML' ? 0 : 1) || (b.date || '').localeCompare(a.date || ''));
    html += `<section><h2>${esc(c)} <span class="count">${rows.length}</span>${catInfo.get(c).old ? '<span class="old">2026 年以前</span>' : ''}</h2>
      <div class="grid">${rows.map(card).join('')}</div></section>`;
  }
  listEl.innerHTML = html || '<p class="empty">没有找到相关资料。</p>';
}

chipsEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  activeCat = b.dataset.cat;
  renderChips();
  render();
});
qEl.addEventListener('input', render);
renderChips();
render();
